name: Bug report
description: Report a SyncHeroic problem without exposing workout or account data
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Never attach raw TrainHeroic JSON, credentials, tokens, workout text, or screenshots containing personal health data. Use only SyncHeroic's shape-only report.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the visible behavior and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SyncHeroic version
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android and Health Connect versions
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Shape-only report
      description: Paste the report generated by SyncHeroic. Confirm it contains paths, types, and counts only.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include raw JSON, credentials, tokens, workout text, names, or health data.
          required: true

