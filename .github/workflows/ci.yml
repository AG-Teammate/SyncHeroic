name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon check :app:assembleDebug
      - name: Reject sensitive and private fixture files
        run: |
          test -z "$(find . -path ./.git -prune -o -type f \( -name '*.jks' -o -name '*.keystore' -o -name '.env' -o -path '*/.private/*' \) -print)"
          ! git grep -IEn 'session[-_]?token.{0,8}[A-Za-z0-9]{24,}|TRAINHEROIC_PASSWORD=[A-Za-z0-9!@#%_+=:-]{3,}'
